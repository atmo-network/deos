name: Heavy Assurance

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  heavy:
    name: Heavy Release Validation
    uses: ./.github/workflows/_validate.yml
    with:
      profile: heavy
