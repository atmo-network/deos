name: Release Candidate Validation

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: Full Release Validation
    uses: ./.github/workflows/_validate.yml
    with:
      profile: full
