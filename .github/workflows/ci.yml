name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validation-gate:
    name: validation-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_INCREMENTAL: 0
      SKIP_WASM_BUILD: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install validation prerequisites
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Setup pinned Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: web-client/package.json

      - name: Prepare pinned dependencies and run fast validation
        run: ./scripts/validate-local.sh fast
