[relaychain]
default_command = "polkadot"
chain = "rococo-local"

[relaychain.genesis.runtimeGenesis.patch.configuration.config.scheduler_params]
max_validators_per_core = 2

[[relaychain.nodes]]
name = "alice"
validator = true
rpc_port = 9944

[[relaychain.nodes]]
name = "bob"
validator = true
rpc_port = 9955

[[parachains]]
id = 2000
chain_spec_path = "./chain_spec.json"
onboard_as_parachain = true

[[parachains.collators]]
name = "alice"
rpc_port = 9988
command = "polkadot-omni-node-deos"
args = ["--force-authoring"]

[[parachains.collators]]
name = "bob"
rpc_port = 9999
command = "polkadot-omni-node-deos"
args = ["--force-authoring"]
