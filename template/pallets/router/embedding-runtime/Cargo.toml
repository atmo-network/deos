[package]
name = "pallet-deos-router-embedding-fixture"
description = "External-consumer runtime fixture for the public pallet-deos-router embedding contract"
version.workspace = true
authors.workspace = true
license = "MIT-0"
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
codec = { workspace = true }
pallet-deos-router.workspace = true
scale-info.workspace = true
polkadot-sdk = { workspace = true, features = [
  "frame-support",
  "frame-system",
  "pallet-assets",
  "pallet-balances",
  "sp-runtime",
] }

[features]
default = ["std"]
std = [
  "codec/std",
  "pallet-deos-router/std",
  "scale-info/std",
  "polkadot-sdk/std",
]
runtime-benchmarks = [
  "pallet-deos-router/runtime-benchmarks",
  "polkadot-sdk/runtime-benchmarks",
]
try-runtime = [
  "pallet-deos-router/try-runtime",
  "polkadot-sdk/try-runtime",
]
